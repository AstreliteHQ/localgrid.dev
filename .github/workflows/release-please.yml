name: Prepare Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Only runs when this push to main was the one that closed out a release
  # PR (i.e. release-please cut a real release), not on every push.
  deploy:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  publish-npm:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/publish-npm.yml
    permissions:
      contents: read
      packages: write

  # Tells localgrid.proxy to rebuild and redeploy its GitHub Pages mirror
  # against the package version just published above. This can't be a
  # `workflow_call` like the two jobs above (those only work for reusable
  # workflows within this same repo) and a plain tag-push trigger on the
  # other repo isn't an option either, since there's no push to that repo at
  # all here. So instead this sends a `repository_dispatch` event to
  # localgrid.proxy over the GitHub API, using a PAT (the default
  # GITHUB_TOKEN can't trigger workflows in a different repository) stored
  # as the PROXY_DISPATCH_TOKEN secret.
  notify-proxy:
    needs: [release-please, publish-npm]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Trigger localgrid.proxy Pages deploy
        env:
          DISPATCH_TOKEN: ${{ secrets.PROXY_DISPATCH_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/AstreliteHQ/localgrid.proxy/dispatches \
            -d "{\"event_type\":\"localgrid-release\",\"client_payload\":{\"tag_name\":\"${TAG_NAME}\"}}"
