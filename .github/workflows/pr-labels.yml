name: PR labels

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review, converted_to_draft, closed]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_thread:
    types: [resolved, unresolved]

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  # Sets a `type: <conventional-commit-type>` label from the PR title, e.g.
  # "feat(widget): add thing" -> `type: feat`. Kept in sync with the types
  # release-please-config.json changelog-sections knows about, plus the
  # extra ones amannn/action-semantic-pull-request (pr-title.yml) allows by
  # default (revert, style) so a valid title never ends up unlabeled.
  type-label:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const TYPES = {
              feat: '1f883d',
              fix: 'd73a4a',
              perf: 'fbca04',
              refactor: '8250df',
              chore: 'ededed',
              docs: '0075ca',
              test: 'bfd4f2',
              ci: 'c5def5',
              build: 'd4c5f9',
              revert: 'b60205',
              style: 'c2e0c6',
            };

            async function ensureLabel(name, color) {
              try {
                await github.rest.issues.getLabel({ ...context.repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ ...context.repo, name, color });
              }
            }

            const title = context.payload.pull_request.title;
            const match = /^(\w+)(?:\([^)]*\))?!?:\s/.exec(title);
            const type = match && Object.hasOwn(TYPES, match[1]) ? match[1] : null;
            const targetLabel = type ? `type: ${type}` : null;

            const issue_number = context.payload.pull_request.number;
            const current = context.payload.pull_request.labels
              .map((label) => label.name)
              .filter((name) => name.startsWith('type: '));

            if (targetLabel && !current.includes(targetLabel)) {
              await ensureLabel(targetLabel, TYPES[type]);
              await github.rest.issues.addLabels({ ...context.repo, issue_number, labels: [targetLabel] });
            }

            for (const name of current) {
              if (name !== targetLabel) {
                await github.rest.issues.removeLabel({ ...context.repo, issue_number, name }).catch(() => {});
              }
            }

  # Sets a single `state: <state>` label reflecting where the PR actually
  # stands, since GitHub's own PR list doesn't surface this at a glance:
  #   state: conflict        - can't be merged as-is, needs a rebase/merge
  #   state: pending-review  - open (unresolved) review threads, changes
  #                             requested, or no approval yet
  #   state: ready           - approved, no open threads, no conflicts
  # Conflict wins over pending-review when both are true, since it blocks
  # merging regardless of review outcome. No label while still a draft, or
  # once the PR is closed or merged.
  state-label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const STATES = {
              conflict: 'e11d21',
              'pending-review': 'fbca04',
              ready: '0e8a16',
            };

            async function ensureLabel(name, color) {
              try {
                await github.rest.issues.getLabel({ ...context.repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ ...context.repo, name, color });
              }
            }

            const issue_number = context.payload.pull_request.number;

            async function setStateLabel(target) {
              const targetLabel = target ? `state: ${target}` : null;
              const { data: labels } = await github.rest.issues.listLabelsOnIssue({ ...context.repo, issue_number });
              const current = labels.map((label) => label.name).filter((name) => name.startsWith('state: '));

              if (targetLabel && !current.includes(targetLabel)) {
                await ensureLabel(targetLabel, STATES[target]);
                await github.rest.issues.addLabels({ ...context.repo, issue_number, labels: [targetLabel] });
              }
              for (const name of current) {
                if (name !== targetLabel) {
                  await github.rest.issues.removeLabel({ ...context.repo, issue_number, name }).catch(() => {});
                }
              }
            }

            // The `pull_request` webhook payload doesn't reliably carry
            // `mergeable` (it's only populated on a direct REST fetch), so
            // fetch the PR fresh rather than trusting the event payload.
            let pr = (await github.rest.pulls.get({ ...context.repo, pull_number: issue_number })).data;

            if (pr.state === 'closed' || pr.draft) {
              await setStateLabel(null);
              return;
            }

            // `mergeable` is computed asynchronously by GitHub and can be
            // `null` right after a push; give it a few short retries before
            // falling back to treating it as unknown.
            for (let attempt = 0; pr.mergeable === null && attempt < 4; attempt++) {
              await new Promise((resolve) => setTimeout(resolve, 2000));
              ({ data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: issue_number }));
            }

            if (pr.mergeable === false) {
              await setStateLabel('conflict');
              return;
            }

            const query = `
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    reviewDecision
                    reviewThreads(first: 100) { nodes { isResolved } }
                  }
                }
              }
            `;
            const result = await github.graphql(query, { ...context.repo, number: issue_number });
            const { reviewDecision, reviewThreads } = result.repository.pullRequest;
            const unresolvedThreads = reviewThreads.nodes.some((thread) => !thread.isResolved);

            await setStateLabel(reviewDecision === 'APPROVED' && !unresolvedThreads ? 'ready' : 'pending-review');
