version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    target-branch: 'main'
    schedule:
      interval: 'weekly'
    labels:
      - 'dependencies'

  - package-ecosystem: 'npm'
    directory: '/'
    target-branch: 'main'
    schedule:
      interval: 'weekly'
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'deps'
      prefix-development: 'chore(deps-dev)'
    groups:
      codemirror:
        patterns:
          - '@codemirror/*'
          - 'codemirror'
          - '@uiw/react-codemirror'
      lezer:
        patterns: ['@lezer/*']
      testing-library:
        patterns: ['@testing-library/*']
      types:
        patterns: ['@types/*']
