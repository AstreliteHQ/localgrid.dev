    <script>
      // Applies the saved theme before first paint, so there's no flash of
      // the wrong theme while the app bundle loads. Storage key and the
      // resolution logic must stay in sync with src/theme/useThemeStore.ts.
      ;(function () {
        try {
          var stored = localStorage.getItem('localgrid.theme')
          var isDark =
            stored === 'dark' ||
            (stored !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', isDark)
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
